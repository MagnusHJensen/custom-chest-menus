plugins {
    id 'multiloader-loader'
    id 'fabric-loom'

    id "com.modrinth.minotaur" version "2.+"
    id "io.github.CDAGaming.cursegradle" version "1.6.1"
}
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

modrinth {
    token = System.getenv("MODRINTH_TOKEN")
    projectId = "1rhw3Wyu" // Required, must be a string, ID of Modrinth project
    versionName = "${mod_name} (Fabric) - v${version} - ${minecraft_version}"
    versionType = "release"
    uploadFile = jar
    gameVersions = ["1.21.1"]
    loaders = ["fabric"]
    changelog = rootProject.file("CHANGELOG.md").text
}

curseforge {
    project {
        apiKey = System.getenv("CURSEFORGE_TOKEN")

        id = "1343005"
        releaseType = "release"


        changelog = rootProject.file("CHANGELOG.md").text
        changelogType = "markdown"
        gameVersionStrings = ["1.21.1"]
        mainArtifact(jar) {
            it.displayName = "${mod_name} (Fabric) - v${version} - ${minecraft_version}"
        }
    }
}